<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Tracking</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#F5F4F1;color:#1A1A18;min-height:100vh;padding:28px 16px 48px}
.wrap{max-width:560px;margin:0 auto}

/* Header */
.brand{text-align:center;margin-bottom:28px}
.brand-name{font-size:20px;font-weight:700;color:#1A1A18;letter-spacing:-.3px}
.brand-tagline{font-size:12px;color:#888780;margin-top:3px}
.powered{font-size:11px;color:#C4C3BE;margin-top:24px;text-align:center}

/* Card */
.card{background:#fff;border-radius:16px;border:1px solid #E8E7E3;overflow:hidden;margin-bottom:14px}

/* Job header */
.job-head{padding:20px 22px}
.job-id{font-size:12px;font-weight:700;color:#3B5BDB;font-family:monospace;letter-spacing:.5px}
.job-client{font-size:22px;font-weight:700;margin:4px 0 2px;color:#1A1A18}
.job-ref{font-size:13px;color:#888780;font-style:italic}
.job-pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill-due-over{background:#FEE2E2;color:#991B1B}
.pill-due-today{background:#FEF3C7;color:#92400E}
.pill-due-tmr{background:#DBEAFE;color:#1E3A8A}
.pill-due-ok{background:#F0FDF4;color:#065F46}
.pill-dispatch{background:#F1F0ED;color:#5F5E5A}
.pill-brand{background:#EEF2FF;color:#3730A3}

/* Progress steps */
.steps{padding:20px 22px;border-top:1px solid #F0EFEc}
.steps-title{font-size:11px;font-weight:700;color:#A8A8A3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px}
.step-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:0}
.step-left{display:flex;flex-direction:column;align-items:center;width:36px;flex-shrink:0}
.step-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;border:2px solid transparent}
.step-dot.done{background:#D1FAE5;border-color:#6EE7B7}
.step-dot.active{background:#3B5BDB;border-color:#3B5BDB;box-shadow:0 0 0 4px #EEF2FF}
.step-dot.pending{background:#F1F0ED;border-color:#E8E7E3}
.step-line{width:2px;height:24px;margin:4px 0}
.step-line.done{background:#6EE7B7}
.step-line.pending{background:#E8E7E3}
.step-body{flex:1;padding-top:7px;padding-bottom:24px}
.step-label{font-size:14px;font-weight:600}
.step-label.done{color:#065F46}
.step-label.active{color:#3B5BDB}
.step-label.pending{color:#C4C3BE}
.step-sub{font-size:12px;margin-top:2px}
.step-sub.done{color:#6EE7B7;color:#34D399}
.step-sub.active{color:#6B85E8}
.step-sub.pending{color:#D8D7D2}
.step-row:last-child .step-body{padding-bottom:0}

/* Items */
.items{padding:18px 22px;border-top:1px solid #F0EFEC}
.items-title{font-size:11px;font-weight:700;color:#A8A8A3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F5F4F1}
.item:last-child{border-bottom:none}
/* Artwork thumbnail */
.item-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid #E8E7E3;flex-shrink:0;display:block;cursor:pointer}
.item-thumb-empty{width:52px;height:52px;border-radius:10px;background:#F1F0ED;border:1px solid #E8E7E3;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}

.item-qty{font-size:13px;font-weight:700;color:#1A1A18;white-space:nowrap}
.item-size{font-size:11px;color:#888780}
.item-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.is-prod{background:#EEF2FF;color:#3730A3}
.is-done{background:#D1FAE5;color:#065F46}
.is-ready{background:#D1FAE5;color:#065F46}
.is-dispatch{background:#DBEAFE;color:#1E3A8A}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}
.lightbox iframe{width:90vw;max-width:700px;height:85vh;border:none;border-radius:12px;background:#fff}
.lightbox-close{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Pickup info */
.pickup-info{padding:18px 22px;border-top:1px solid #F0EFEC;background:#F9FFF9}
.pickup-title{font-size:12px;font-weight:700;color:#065F46;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.pickup-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:13px;color:#1A1A18}
.pickup-icon{font-size:16px;flex-shrink:0;width:22px}
.directions{margin-top:10px;padding:10px 14px;background:#F0FDF4;border-radius:10px;font-size:12px;color:#065F46;line-height:1.6}

/* Dispatch info */
.dispatch-info{padding:18px 22px;border-top:1px solid #F0EFEC;background:#F0F6FF}
.dispatch-title{font-size:12px;font-weight:700;color:#1E3A8A;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.dispatch-row{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:13px;color:#1A1A18}
.tracking-num{font-family:monospace;font-size:14px;font-weight:700;color:#1E3A8A;background:#EFF6FF;padding:6px 12px;border-radius:8px;display:inline-block;margin-top:4px;letter-spacing:.5px}

/* States */
.loading{text-align:center;padding:60px 20px;color:#888780}
.loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3B5BDB;animation:ld .8s ease-in-out infinite}
.loading-dot:nth-child(2){animation-delay:.15s}
.loading-dot:nth-child(3){animation-delay:.3s}
@keyframes ld{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.error-card{background:#fff;border-radius:16px;border:1px solid #FECACA;padding:32px 24px;text-align:center}
.error-icon{font-size:32px;margin-bottom:12px}
.error-title{font-size:16px;font-weight:700;color:#991B1B;margin-bottom:6px}
.error-sub{font-size:13px;color:#888780;line-height:1.5}
.complete-banner{background:#D1FAE5;border:1.5px solid #6EE7B7;border-radius:12px;padding:16px 20px;text-align:center;margin-bottom:14px}
.complete-banner-title{font-size:15px;font-weight:700;color:#065F46}
.complete-banner-sub{font-size:12px;color:#34D399;margin-top:3px}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-name" id="brand-name">ES Print</div>
    <div class="brand-tagline">Order Tracking</div>
  </div>

  <div id="loading-state" class="loading">
    <div style="margin-bottom:16px">
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
      <span class="loading-dot"></span>
    </div>
    <div style="font-size:14px">Loading your order...</div>
  </div>

  <div id="error-state" style="display:none">
    <div class="error-card">
      <div class="error-icon">📦</div>
      <div class="error-title" id="error-title">Order not found</div>
      <div class="error-sub" id="error-sub">This tracking link may be invalid or has expired. Please contact us if you need help.</div>
    </div>
  </div>

  <div id="job-state" style="display:none"></div>

  <div class="powered">Powered by ES Print · <span id="contact-brand"></span></div>

</div>

<script>
// ── CLIENT-FRIENDLY STATUS MAP ────────────────────────────────────────────────
// Internal status → what the client sees
const CLIENT_STATUS={
  'Prepress':       {label:'In production',      cls:'is-prod', step:'production'},
  'Printing':       {label:'Being printed',      cls:'is-prod', step:'production'},
  'Cutting':        {label:'Being finished',     cls:'is-prod', step:'production'},
  'Handwork':       {label:'Being finished',     cls:'is-prod', step:'production'},
  'QA':             {label:'Quality check',      cls:'is-prod', step:'production'},
  'Packed':         {label:'Packed',             cls:'is-prod', step:'packing'},
  'Packed Ready':   {label:'Ready for you',      cls:'is-ready',step:'ready'},
  'Dispatch Ready': {label:'Ready to dispatch',  cls:'is-dispatch',step:'dispatching'},
  'Dispatched':     {label:'On its way',         cls:'is-dispatch',step:'dispatched'},
  'Collected':      {label:'Collected',          cls:'is-done', step:'done'},
  'Outsourced':     {label:'In production',      cls:'is-prod', step:'production'},
  // v1 names just in case
  'Prepress Ready': {label:'In production',      cls:'is-prod', step:'production'},
  'Print Ready':    {label:'Being printed',      cls:'is-prod', step:'production'},
  'QA Ready':       {label:'Quality check',      cls:'is-prod', step:'production'},
  'Ready for Pick Up':{label:'Ready for you',   cls:'is-ready',step:'ready'},
  'Ready to Dispatch':{label:'Ready to dispatch',cls:'is-dispatch',step:'dispatching'},
};

// Steps shown to client — simple 4-step journey
const PICKUP_STEPS=[
  {key:'production', icon:'🖨',  label:'In production',        sub:'Your order is being produced'},
  {key:'packing',    icon:'📦',  label:'Packed & quality checked', sub:'Your order has been packed'},
  {key:'ready',      icon:'✅',  label:'Ready for collection', sub:'Your order is ready — come pick it up!'},
  {key:'done',       icon:'🎉',  label:'Collected',            sub:'Order complete — thank you!'},
];
const DISPATCH_STEPS=[
  {key:'production',  icon:'🖨',  label:'In production',     sub:'Your order is being produced'},
  {key:'packing',     icon:'📦',  label:'Packed & quality checked', sub:'Your order has been packed'},
  {key:'dispatching', icon:'🚚',  label:'Dispatched',        sub:'Your order is on its way'},
  {key:'dispatched',  icon:'🚚',  label:'On its way',        sub:'Your order is on its way to you'},
];

const BRAND_NAMES={
  'Event Signs':'Event Signs',
  'Sticky Stitch':'Sticky Stitch',
  'Melbourne Trade Signs':'Melbourne Trade Signs',
  'Melbourne Floor Wraps':'Melbourne Floor Wraps',
};

function getDueInfo(due){
  if(!due)return{label:null,cls:null};
  const now=new Date();now.setHours(0,0,0,0);
  const d=new Date(due);d.setHours(0,0,0,0);
  const diff=Math.round((d-now)/(864e5));
  const dateStr=d.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
  if(diff<0)return{label:'Was due '+dateStr,cls:'pill-due-over'};
  if(diff===0)return{label:'Due today',cls:'pill-due-today'};
  if(diff===1)return{label:'Due tomorrow',cls:'pill-due-tmr'};
  return{label:'Due '+dateStr,cls:'pill-due-ok'};
}

function getOverallStep(items,dispatch){
  // Work out the furthest step all items have reached
  const steps=dispatch==='Pick Up'?PICKUP_STEPS:DISPATCH_STEPS;
  const stepKeys=steps.map(s=>s.key);

  // Map each item to a step index
  const itemSteps=items.map(i=>{
    const cs=CLIENT_STATUS[i.status]||{step:'production'};
    const idx=stepKeys.indexOf(cs.step);
    return idx===-1?0:idx;
  });

  // Overall = minimum step (slowest item)
  return Math.min(...itemSteps);
}

function renderJob(job){
  const items=job.items||[];
  const isPickup=job.dispatch==='Pick Up';
  const isDispatched=items.every(i=>i.status==='Dispatched'||i.status==='Collected');
  const steps=isPickup?PICKUP_STEPS:DISPATCH_STEPS;
  const currentStepIdx=getOverallStep(items,job.dispatch);
  const brandName=BRAND_NAMES[job.brand]||job.brand||'ES Print';
  document.getElementById('brand-name').textContent=brandName;
  document.getElementById('contact-brand').textContent=brandName;

  const dueInfo=getDueInfo(job.due);

  // Complete banner
  // Only show complete banner for pickup jobs — dispatch jobs show 'on its way' not 'delivered'
  const isComplete=isPickup&&isDispatched;
  const completeBanner=isComplete?`<div class="complete-banner">
    <div class="complete-banner-title">✅ Order collected — thank you!</div>
    <div class="complete-banner-sub">We hope to see you again soon</div>
  </div>`:'';

  // Progress steps
  const stepsHtml=steps.map((s,idx)=>{
    const state=idx<currentStepIdx?'done':idx===currentStepIdx?'active':'pending';
    const isLast=idx===steps.length-1;
    const subText=state==='active'?s.sub:state==='done'?'Complete':'Waiting';
    return`<div class="step-row">
      <div class="step-left">
        <div class="step-dot ${state}">${state==='done'?'✓':state==='active'?s.icon:'○'}</div>
        ${!isLast?`<div class="step-line ${state==='done'?'done':'pending'}"></div>`:''}
      </div>
      <div class="step-body">
        <div class="step-label ${state}">${s.label}</div>
        <div class="step-sub ${state}">${subText}</div>
      </div>
    </div>`;
  }).join('');

function driveThumb(url){
  if(!url)return null;
  const m=url.match(/\/d\/([^/]+)/)||url.match(/id=([^&]+)/);
  return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w120`:null;
}
function drivePreview(url){
  if(!url)return null;
  const m=url.match(/\/d\/([^/]+)/)||url.match(/id=([^&]+)/);
  return m?`https://drive.google.com/file/d/${m[1]}/preview`:null;
}

  // Items
  const itemsHtml=items.map(i=>{
    const cs=CLIENT_STATUS[i.status]||{label:'In production',cls:'is-prod'};
    const artworks=i.artworks&&i.artworks.length>0?i.artworks:[{drive:i.drive,qty:i.qty,label:i.label||''}];
    const thumb=i.drive?driveThumb(i.drive):null;
    const preview=i.drive?drivePreview(i.drive):null;
    return`<div class="item">
      ${thumb
        ?`<img class="item-thumb" src="${esc(thumb)}" alt="Artwork preview" onclick="openPreview('${esc(preview)}')" onerror="this.parentElement.querySelector('.item-thumb-empty')&&(this.style.display='none');this.insertAdjacentHTML('afterend','<div class=\\'item-thumb-empty\\'>🖼</div>')">`
        :`<div class="item-thumb-empty">🖼</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:#1A1A18">${qty(i.qty)} ${esc(i.stock)}</div>
        ${i.size?`<div class="item-size">${esc(i.size)} mm</div>`:''}
        ${i.label?`<div style="font-size:11px;color:#888780;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📄 ${esc(i.label)}</div>`:''}
      </div>
      <span class="item-status ${cs.cls}">${cs.label}</span>
    </div>`;
  }).join('');

  // Pick up info block
  const pickupBlock=isPickup?`<div class="pickup-info">
    <div class="pickup-title">📍 Pick up details</div>
    <div class="pickup-row"><span class="pickup-icon">📍</span><span>Unit 84/90 Cranwell Street, Braybrook VIC 3019</span></div>
    <div class="pickup-row"><span class="pickup-icon">🕐</span><span>Monday – Friday · 8:00 AM – 2:00 PM</span></div>
    <div class="directions">After entering through the gate, turn right immediately and follow the road to the end, then turn left — you'll see Unit 84.</div>
  </div>`:'';

  // Dispatch info block
  const dispatchBlock=(!isPickup&&job.courier)?`<div class="dispatch-info">
    <div class="dispatch-title">🚚 Delivery details</div>
    <div class="dispatch-row"><strong>Courier:</strong>&nbsp;${esc(job.courier)}</div>
    ${job.tracking?`<div><div class="tracking-num">${esc(job.tracking)}</div></div>`:''}
    ${job.address?`<div class="dispatch-row" style="margin-top:8px"><strong>To:</strong>&nbsp;${esc(job.address)}</div>`:''}
  </div>`:'';

  document.getElementById('job-state').innerHTML=`
    ${completeBanner}
    <div class="card">
      <div class="job-head">
        <div class="job-id">${esc(job.id)}</div>
        <div class="job-client">${esc(job.client)}</div>
        ${job.ref?`<div class="job-ref">"${esc(job.ref)}"</div>`:''}
        <div class="job-pills">
          ${dueInfo.label?`<span class="pill ${dueInfo.cls}">${dueInfo.label}</span>`:''}
          <span class="pill pill-dispatch">${esc(job.dispatch||'Pick Up')}</span>
          ${job.brand?`<span class="pill pill-brand">${esc(brandName)}</span>`:''}
        </div>
      </div>
      <div class="steps">
        <div class="steps-title">Order progress</div>
        ${stepsHtml}
      </div>
      <div class="items">
        <div class="items-title">Your items (${items.length})</div>
        ${itemsHtml}
      </div>
      ${pickupBlock}
      ${dispatchBlock}
    </div>
  `;

  document.getElementById('loading-state').style.display='none';
  document.getElementById('job-state').style.display='';
}

function showError(title,sub){
  document.getElementById('loading-state').style.display='none';
  document.getElementById('error-state').style.display='';
  if(title)document.getElementById('error-title').textContent=title;
  if(sub)document.getElementById('error-sub').textContent=sub;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qty(q){return q?q+'×':'';}

// ── LOAD ──────────────────────────────────────────────────────────────────────
const params=new URLSearchParams(window.location.search);
const jobId=params.get('id');
const token=params.get('token');
const api=params.get('api');

if(!jobId||!token||!api){
  showError('Invalid tracking link','This link is missing required information. Please contact us for help.');
} else {
  // Update page title
  document.title='Order '+jobId+' · Tracking';

  fetch(api+'?action=trackJob&id='+encodeURIComponent(jobId)+'&token='+encodeURIComponent(token))
    .then(r=>r.json())
    .then(d=>{
      if(!d.ok){
        showError('Order not found','We couldn\'t find this order. The link may have expired or the order may have been updated. Please contact us if you need help.');
      } else {
        renderJob(d.job);
      }
    })
    .catch(()=>{
      showError('Could not connect','Please check your internet connection and try again. If the problem persists please contact us.');
    });
}

function openPreview(url){
  if(!url)return;
  const lb=document.getElementById('lightbox');
  const fr=document.getElementById('lightbox-frame');
  if(fr)fr.src=url;
  if(lb)lb.classList.add('open');
}
function closeLightbox(){
  const lb=document.getElementById('lightbox');
  const fr=document.getElementById('lightbox-frame');
  if(lb)lb.classList.remove('open');
  if(fr)fr.src='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
</script>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <iframe id="lightbox-frame" src="" allowfullscreen></iframe>
</div>
</body>
</html>
